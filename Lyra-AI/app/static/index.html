<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>" />
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151d;
    --panel-2: #171b25;
    --line: #232838;
    --text: #e8ecf5;
    --muted: #8b95ad;
    --accent: #8b7cf6;
    --accent-2: #22d3ee;
    --user: #1e2534;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(139,124,246,.16), transparent 60%),
      radial-gradient(900px 500px at 95% 110%, rgba(34,211,238,.12), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 16px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: flex;
    justify-content: center;
  }
  .app {
    width: min(920px, 100%);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 4px 14px;
    border-bottom: 1px solid var(--line);
  }
  .avatar {
    width: 46px; height: 46px;
    display: grid; place-items: center;
    font-size: 24px;
    border-radius: 14px;
    background: linear-gradient(160deg, rgba(139,124,246,.35), rgba(34,211,238,.2));
    border: 1px solid rgba(139,124,246,.4);
    box-shadow: 0 6px 20px rgba(139,124,246,.18);
    flex: none;
  }
  .ident h1 { margin: 0; font-size: 17px; letter-spacing: .2px; }
  .ident p { margin: 0; font-size: 13px; color: var(--muted); }
  .spacer { flex: 1; }
  .badge {
    font-size: 11px; letter-spacing: .5px; text-transform: uppercase;
    color: var(--accent-2);
    border: 1px solid rgba(34,211,238,.35);
    background: rgba(34,211,238,.08);
    padding: 5px 9px; border-radius: 999px;
  }
  .icon-btn {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: 10px;
    width: 36px; height: 36px; cursor: pointer; font-size: 15px;
    transition: .15s;
  }
  .icon-btn:hover { color: var(--text); border-color: #33405a; background: var(--panel-2); }
  .icon-btn.on {
    color: #0b0d12; background: linear-gradient(160deg, var(--accent-2), #14b8a6);
    border-color: transparent;
  }

  .tool {
    align-self: flex-start; margin-left: 42px;
    font-size: 12.5px; color: var(--muted);
    display: flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px;
    background: rgba(34,211,238,.07); border: 1px solid rgba(34,211,238,.22);
    animation: rise .25s ease both;
  }
  .tool .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2);
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .25; } }

  .speak {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 12px; padding: 0; margin-top: 6px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .speak:hover { color: var(--accent-2); }
  .speak.playing { color: var(--accent-2); }

  #log {
    flex: 1; overflow-y: auto; padding: 22px 4px 8px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: #222838; border-radius: 8px; }

  .msg { display: flex; gap: 12px; max-width: 88%; animation: rise .25s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .msg .bubble {
    padding: 12px 15px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.ai .bubble {
    background: var(--panel); border: 1px solid var(--line);
    border-top-left-radius: 5px;
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.user .bubble {
    background: linear-gradient(160deg, rgba(139,124,246,.22), rgba(139,124,246,.1));
    border: 1px solid rgba(139,124,246,.35);
    border-top-right-radius: 5px;
  }
  .mini {
    width: 30px; height: 30px; flex: none; border-radius: 9px;
    display: grid; place-items: center; font-size: 15px;
    background: var(--panel-2); border: 1px solid var(--line);
  }
  .msg.ai .mini { background: linear-gradient(160deg, rgba(139,124,246,.3), rgba(34,211,238,.16)); }
  .cursor::after {
    content: "▍"; color: var(--accent);
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .err { color: #ff9d9d; font-size: 14px; }

  .empty {
    margin: auto; text-align: center; color: var(--muted); max-width: 460px;
  }
  .empty .big { font-size: 44px; margin-bottom: 10px; }
  .empty h2 { color: var(--text); font-size: 19px; margin: 0 0 6px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .chip {
    font-size: 13px; color: var(--text); cursor: pointer;
    background: var(--panel); border: 1px solid var(--line);
    padding: 8px 13px; border-radius: 999px; transition: .15s;
  }
  .chip:hover { border-color: rgba(139,124,246,.6); background: var(--panel-2); }

  form {
    display: flex; gap: 10px; align-items: flex-end;
    padding: 12px 0 18px;
  }
  textarea {
    flex: 1; resize: none; max-height: 180px; min-height: 48px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 14px;
    padding: 13px 15px; font: inherit; line-height: 1.5;
    outline: none; transition: border-color .15s;
  }
  textarea:focus { border-color: rgba(139,124,246,.65); }
  textarea::placeholder { color: #6b7488; }
  button.send {
    width: 48px; height: 48px; flex: none; border: none; border-radius: 14px;
    background: linear-gradient(160deg, var(--accent), #6d5ce7);
    color: #fff; font-size: 18px; cursor: pointer;
    transition: .15s; box-shadow: 0 8px 22px rgba(139,124,246,.28);
  }
  button.send:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
  button.send:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 16px; padding: 20px; width: min(520px, 92vw);
  }
  dialog::backdrop { background: rgba(5,7,12,.7); backdrop-filter: blur(3px); }
  dialog h3 { margin: 0 0 6px; font-size: 16px; }
  dialog p.hint { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .fact { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .fact span { flex: 1; }
  .fact button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; }
  .fact button:hover { color: #ff9d9d; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  .row input {
    flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 10px 12px; font: inherit; outline: none;
  }
  .row input:focus { border-color: rgba(139,124,246,.65); }
  .row button, .ghost {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; cursor: pointer; font: inherit;
  }
  .row button:hover, .ghost:hover { border-color: #33405a; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar" id="avatar">🌙</div>
    <div class="ident">
      <h1 id="name">…</h1>
      <p id="tagline"></p>
    </div>
    <div class="spacer"></div>
    <span class="badge" id="model">local</span>
    <button class="icon-btn" id="voiceBtn" title="Voz">🔊</button>
    <button class="icon-btn" id="memBtn" title="Memoria">🧠</button>
    <button class="icon-btn" id="resetBtn" title="Nueva conversación">↻</button>
  </header>

  <div id="log">
    <div class="empty" id="empty">
      <div class="big" id="emptyAvatar">🌙</div>
      <h2 id="emptyTitle">Hola</h2>
      <p id="emptyText">Todo lo que hables se queda en tu equipo.</p>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="Escribe un mensaje…" autocomplete="off"></textarea>
    <button class="send" id="send" type="submit" title="Enviar">↑</button>
  </form>
</div>

<dialog id="memDialog">
  <h3>Memoria del personaje</h3>
  <p class="hint">Hechos que recordará en todas las conversaciones.</p>
  <div id="facts"></div>
  <div class="row">
    <input id="factInput" placeholder="Ej.: Se llama Ana y vive en Madrid" maxlength="500" />
    <button id="addFact" type="button">Añadir</button>
  </div>
  <div class="row" style="justify-content: space-between;">
    <button class="ghost" id="clearFacts" type="button">Borrar todo</button>
    <button class="ghost" id="closeDialog" type="button">Cerrar</button>
  </div>
</dialog>

<script>
const log = document.getElementById('log');
const empty = document.getElementById('empty');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const form = document.getElementById('form');
let character = { name: 'IA', avatar: '🤖', voice: false, tools: false };
let busy = false;
let voiceOn = localStorage.getItem('lyra-voice') === '1';
let currentAudio = null;

const SUGGESTIONS = [
  '¿Quién eres?',
  'Cuéntame algo curioso',
  'Ayúdame a ordenar mis ideas',
  '¿Qué recuerdas de mí?'
];

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function scrollDown() { log.scrollTop = log.scrollHeight; }

function addMessage(role, text) {
  empty.style.display = 'none';
  const wrap = el('div', 'msg ' + (role === 'user' ? 'user' : 'ai'));
  wrap.appendChild(el('div', 'mini', role === 'user' ? '🙂' : character.avatar));
  const bubble = el('div', 'bubble', text || '');
  wrap.appendChild(bubble);
  log.appendChild(wrap);
  scrollDown();
  return bubble;
}

async function loadCharacter() {
  const res = await fetch('/api/character');
  character = await res.json();
  document.getElementById('avatar').textContent = character.avatar;
  document.getElementById('name').textContent = character.name;
  document.getElementById('tagline').textContent = character.tagline || character.role;
  document.getElementById('model').textContent = character.model;
  document.getElementById('emptyAvatar').textContent = character.avatar;
  document.getElementById('emptyTitle').textContent = `Hola, soy ${character.name}`;
  document.title = character.name;

  const voiceBtn = document.getElementById('voiceBtn');
  if (character.voice) {
    voiceBtn.classList.toggle('on', voiceOn);
    voiceBtn.title = voiceOn ? 'Voz activada' : 'Voz desactivada';
  } else {
    voiceBtn.disabled = true;
    voiceBtn.style.opacity = '.35';
    voiceBtn.title = 'Voz no instalada';
  }
  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  SUGGESTIONS.forEach(text => {
    const chip = el('button', 'chip', text);
    chip.type = 'button';
    chip.onclick = () => { input.value = text; form.requestSubmit(); };
    chips.appendChild(chip);
  });
}

function addToolChip(label) {
  empty.style.display = 'none';
  const chip = el('div', 'tool');
  chip.appendChild(el('span', 'dot'));
  chip.appendChild(el('span', '', label + '…'));
  log.appendChild(chip);
  scrollDown();
  return chip;
}

async function speak(text, button) {
  if (!text.trim()) return;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (button) button.classList.add('playing');
  try {
    const res = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    if (!res.ok) throw new Error('voz no disponible');
    const url = URL.createObjectURL(await res.blob());
    currentAudio = new Audio(url);
    currentAudio.onended = () => {
      if (button) button.classList.remove('playing');
      URL.revokeObjectURL(url);
      currentAudio = null;
    };
    await currentAudio.play();
  } catch (err) {
    if (button) button.classList.remove('playing');
    console.warn('TTS:', err.message);
  }
}

async function send(message) {
  if (busy || !message.trim()) return;
  busy = true;
  sendBtn.disabled = true;
  input.value = '';
  input.style.height = 'auto';
  addMessage('user', message);
  const bubble = addMessage('ai', '');
  bubble.classList.add('cursor');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message })
    });
    if (!res.ok) throw new Error('El servidor devolvió ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.replace(/^data: /, '').trim();
        if (!line) continue;
        let evt;
        try { evt = JSON.parse(line); } catch { continue; }
        if (evt.type === 'delta') {
          bubble.textContent += evt.text;
          scrollDown();
        } else if (evt.type === 'tool') {
          bubble.textContent = '';
          addToolChip(evt.text);
        } else if (evt.type === 'reset') {
          bubble.textContent = '';
        } else if (evt.type === 'error') {
          bubble.textContent += '\n[Error: ' + evt.text + ']';
          bubble.classList.add('err');
        }
      }
    }
  } catch (err) {
    bubble.textContent = 'No pude responder: ' + err.message;
    bubble.classList.add('err');
  } finally {
    bubble.classList.remove('cursor');
    busy = false;
    sendBtn.disabled = false;
    input.focus();
    scrollDown();
  }

  const finalText = bubble.textContent;
  if (finalText.trim() && !bubble.classList.contains('err')) {
    const btn = el('button', 'speak', '🔊 Escuchar');
    btn.type = 'button';
    btn.onclick = () => speak(bubble.textContent, btn);
    bubble.parentElement.appendChild(btn);
    if (voiceOn && character.voice) speak(finalText, btn);
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  send(input.value);
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
});

document.getElementById('voiceBtn').onclick = () => {
  if (!character.voice) return;
  voiceOn = !voiceOn;
  localStorage.setItem('lyra-voice', voiceOn ? '1' : '0');
  const btn = document.getElementById('voiceBtn');
  btn.classList.toggle('on', voiceOn);
  btn.title = voiceOn ? 'Voz activada' : 'Voz desactivada';
  if (!voiceOn && currentAudio) { currentAudio.pause(); currentAudio = null; }
};

document.getElementById('resetBtn').onclick = async () => {
  await fetch('/api/reset', { method: 'POST' });
  log.querySelectorAll('.msg, .tool').forEach(n => n.remove());
  empty.style.display = '';
};

// --- Memoria ---
const dialog = document.getElementById('memDialog');
const factsBox = document.getElementById('facts');

async function renderFacts() {
  const { facts } = await (await fetch('/api/memory')).json();
  factsBox.innerHTML = '';
  if (!facts.length) {
    factsBox.appendChild(el('p', 'hint', 'Todavía no recuerda nada.'));
    return;
  }
  facts.forEach(fact => {
    const row = el('div', 'fact');
    row.appendChild(el('span', '', fact));
    const del = el('button', '', '✕');
    del.type = 'button';
    del.title = 'Olvidar';
    del.onclick = async () => {
      await fetch('/api/memory?fact=' + encodeURIComponent(fact), { method: 'DELETE' });
      renderFacts();
    };
    row.appendChild(del);
    factsBox.appendChild(row);
  });
}

document.getElementById('memBtn').onclick = () => { renderFacts(); dialog.showModal(); };
document.getElementById('closeDialog').onclick = () => dialog.close();
document.getElementById('addFact').onclick = async () => {
  const field = document.getElementById('factInput');
  if (!field.value.trim()) return;
  await fetch('/api/memory', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fact: field.value })
  });
  field.value = '';
  renderFacts();
};
document.getElementById('clearFacts').onclick = async () => {
  await fetch('/api/memory/clear', { method: 'POST' });
  renderFacts();
};
document.getElementById('factInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('addFact').click(); }
});

loadCharacter();
input.focus();
</script>
</body>
</html>
